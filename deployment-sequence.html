<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deployment Sequence — Steps 3 to 7</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #ffffff; }
</style>
</head>
<body>
<svg viewBox="0 0 1300 480" xmlns="http://www.w 3.org/2000/svg" font-family="Arial, sans-serif">
  <rect x="0" y="0" width="1300" height="480" fill="white"/>
  <text x="650" y="30" text-anchor="middle" font-size="20" font-weight="bold">
    Deployment Sequence — Steps 3 to 7
  </text>
  <text x="650" y="50" text-anchor="middle" font-size="13" fill="#555">
    Orbital data center commissioning, from orbit insertion to comms link establishment
  </text>
  <defs>
    <marker id="arrow 2" markerWidth="10" markerHeight="10" refX="0" refY="5" orient="auto">
      <path d="M 0,0 L 10,5 L 0,10 Z" fill="#333"/>
    </marker>
  </defs>
  <rect x="30" y="110" width="200" height="140" rx="8" fill="#4a 7fd 6" stroke="#2a 4f 96" stroke-width="2"/>
  <text x="130" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 3</text>
  <text x="130" y="155" text-anchor="middle" font-size="12" fill="white">Orbit Insertion &amp;</text>
  <text x="130" y="170" text-anchor="middle" font-size="12" fill="white">Circularization</text>
  <line x 1="55" y 1="182" x 2="205" y 2="182" stroke="white" stroke-opacity="0.5"/>
  <text x="130" y="200" text-anchor="middle" font-size="10" fill="#dbe 6ff">Burn to target orbit,</text>
  <text x="130" y="214" text-anchor="middle" font-size="10" fill="#dbe 6ff">confirm stable altitude</text>
  <text x="130" y="228" text-anchor="middle" font-size="10" fill="#dbe 6ff">and inclination</text>
  <rect x="280" y="110" width="220" height="140" rx="8" fill="#4a 7fd 6" stroke="#2a 4f 96" stroke-width="2"/>
  <text x="390" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 4</text>
  <text x="390" y="155" text-anchor="middle" font-size="12" fill="white">Deployment</text>
  <line x 1="305" y 1="182" x 2="475" y 2="182" stroke="white" stroke-opacity="0.5"/>
  <text x="390" y="200" text-anchor="middle" font-size="10" fill="#dbe 6ff">Solar arrays unfold first,</text>
  <text x="390" y="214" text-anchor="middle" font-size="10" fill="#dbe 6ff">then radiator panels,</text>
  <text x="390" y="228" text-anchor="middle" font-size="10" fill="#dbe 6ff">then structural lock-in</text>
  <rect x="550" y="110" width="220" height="140" rx="8" fill="#4a 7fd 6" stroke="#2a 4f 96" stroke-width="2"/>
  <text x="660" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 5</text>
  <text x="660" y="155" text-anchor="middle" font-size="12" fill="white">Cold Start &amp;</text>
  <text x="660" y="170" text-anchor="middle" font-size="12" fill="white">Commissioning</text>
  <line x 1="575" y 1="182" x 2="745" y 2="182" stroke="white" stroke-opacity="0.5"/>
  <text x="660" y="200" text-anchor="middle" font-size="10" fill="#dbe 6ff">Power up racks sequentially,</text>
  <text x="660" y="214" text-anchor="middle" font-size="10" fill="#dbe 6ff">bring up NVLink domains,</text>
  <text x="660" y="228" text-anchor="middle" font-size="10" fill="#dbe 6ff">then optical scale-out fabric</text>
  <rect x="820" y="110" width="200" height="140" rx="8" fill="#4a 7fd 6" stroke="#2a 4f 96" stroke-width="2"/>
  <text x="920" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 6</text>
  <text x="920" y="155" text-anchor="middle" font-size="12" fill="white">Attitude Lock</text>
  <line x 1="845" y 1="182" x 2="995" y 2="182" stroke="white" stroke-opacity="0.5"/>
  <text x="920" y="200" text-anchor="middle" font-size="10" fill="#dbe 6ff">Orient arrays sun-facing,</text>
  <text x="920" y="214" text-anchor="middle" font-size="10" fill="#dbe 6ff">radiators toward deep space,</text>
  <text x="920" y="228" text-anchor="middle" font-size="10" fill="#dbe 6ff">away from Earth IR</text>
  <rect x="1050" y="110" width="220" height="140" rx="8" fill="#4a 7fd 6" stroke="#2a 4f 96" stroke-width="2"/>
  <text x="1160" y="135" text-anchor="middle" font-size="13" font-weight="bold" fill="white">Step 7</text>
  <text x="1160" y="155" text-anchor="middle" font-size="12" fill="white">Comms Link</text>
  <text x="1160" y="170" text-anchor="middle" font-size="12" fill="white">Establishment</text>
  <line x 1="1075" y 1="182" x 2="1245" y 2="182" stroke="white" stroke-opacity="0.5"/>
  <text x="1160" y="200" text-anchor="middle" font-size="10" fill="#dbe 6ff">Optical inter-satellite or</text>
  <text x="1160" y="214" text-anchor="middle" font-size="10" fill="#dbe 6ff">ground link — RF alone is</text>
  <text x="1160" y="228" text-anchor="middle" font-size="10" fill="#dbe 6ff">a bottleneck at this scale</text>
  <line x 1="230" y 1="180" x 2="278" y 2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow 2)"/>
  <line x 1="500" y 1="180" x 2="548" y 2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow 2)"/>
  <line x 1="770" y 1="180" x 2="818" y 2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow 2)"/>
  <line x 1="1020" y 1="180" x 2="1048" y 2="180" stroke="#333" stroke-width="2" marker-end="url(#arrow 2)"/>
  <text x="254" y="270" text-anchor="middle" font-size="10" fill="#a 33" font-style="italic">stable orbit confirmed</text>
  <text x="524" y="270" text-anchor="middle" font-size="10" fill="#a 33" font-style="italic">arrays + radiators locked</text>
  <text x="794" y="270" text-anchor="middle" font-size="10" fill="#a 33" font-style="italic">fabric healthy, GPUs live</text>
  <text x="1034" y="270" text-anchor="middle" font-size="10" fill="#a 33" font-style="italic">attitude stable, sun-locked</text>
  <rect x="30" y="320" width="1240" height="130" rx="8" fill="#f 5f 5f 5" stroke="#ccc"/>
  <text x="50" y="345" font-size="12" font-weight="bold">Key dependency: power before everything else</text>
  <text x="50" y="368" font-size="11" fill="#333">
    Step 4 deploys solar arrays before radiators, because the cluster needs electrical power before it needs
  </text>
  <text x="50" y="386" font-size="11" fill="#333">
    active thermal transport running. Step 5's rack power-up is sequential, not simultaneous, so any short circuit
  </text>
  <text x="50" y="404" font-size="11" fill="#333">
    or fault is caught on one rack rather than across all nine at once. Step 6 (attitude lock) must hold before
  </text>
  <text x="50" y="422" font-size="11" fill="#333">
    steady-state operation, since a radiator pointed at Earth's infrared flux instead of deep space loses much
  </text>
  <text x="50" y="440" font-size="11" fill="#333">
    of its rejection capacity — this is a hard gate, not a nice-to-have.
  </text>
</svg>
</body>
</html>
